<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>mudscript :// documentation</title>

        <!-- Markdown renderer -->
        <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
        <!-- Syntax highlighting (Lua + plain text) -->
        <link
            rel="stylesheet"

        />
        <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/lua.min.js"></script>

        <style>
            /* Variables */
            :root {
                --bg: #0d0f09;
                --surface: #141810;
                --surface2: #1c2116;
                --border: rgba(141, 184, 78, 0.30);
                --text: #d4cfb6;
                --muted: rgba(212, 207, 182, 0.55);
                --accent: #6b8c3a;
                --accent-hi: #8db84e;
                --accent-glow: rgba(107, 140, 58, 0.4);
                --surface3: #24291a;
                --hover: #2d3523;
                --text2: rgba(212, 207, 182, 0.85);
                --text3: rgba(212, 207, 182, 0.55);
                --border-dim: rgba(141, 184, 78, 0.14);
                --success: #7aa63c;
                --danger: #c0492e;
                --warning: #c4a030;
                --radius: 8px;
                --radius-s: 5px;
                --font: Arial, "Almendra", sans-serif;
                --font-mono: "JetBrains Mono", "SF Mono", "Menlo", monospace;
                --sidebar-w: 268px;
                --header-h: 52px;
                --content-max: 800px;
            }

            /* Reset */
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html {
                scroll-behavior: smooth;
            }

            body {
                font-family: var(--font);
                background: var(--bg);
                color: var(--text);
                line-height: 1.75;
                font-size: 15px;
            }

            /* Header */
            #header {
                position: fixed;
                inset: 0 0 auto 0;
                height: var(--header-h);
                background: var(--surface);
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: center;
                padding: 0 20px;
                gap: 12px;
                z-index: 200;
            }

            #header .brand {
                display: flex;
                align-items: center;
                gap: 8px;
                text-decoration: none;
            }

            #header .brand {
                font-family: var(--font-mono);
                font-size: 14px;
                gap: 6px;
            }

            #header .brand-name {
                font-weight: 700;
                color: var(--accent);
            }

            #header .brand-sep {
                color: var(--text3);
            }

            #header .brand-sub {
                color: var(--muted);
            }

            #header .spacer {
                flex: 1;
            }

            /* Platform switcher */
            .switcher {
                display: flex;
                gap: 2px;
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 3px;
            }

            .switcher button {
                padding: 4px 14px;
                border: none;
                border-radius: var(--radius);
                background: transparent;
                color: var(--muted);
                font-size: 13px;
                font-weight: 500;
                cursor: pointer;
                transition:
                    background 0.15s,
                    color 0.15s;
            }

            .switcher button:hover {
                color: var(--text);
            }

            .switcher button.active {
                background: var(--accent);
                color: var(--bg);
            }

            /* Layout */
            #layout {
                display: flex;
                margin-top: var(--header-h);
                min-height: calc(100vh - var(--header-h));
            }

            /* Sidebar */
            #sidebar {
                width: var(--sidebar-w);
                flex-shrink: 0;
                position: sticky;
                top: var(--header-h);
                height: calc(100vh - var(--header-h));
                overflow-y: auto;
                overflow-x: hidden;
                border-right: 1px solid var(--border);
                background: var(--surface);
                padding: 20px 0 40px;
            }

            #toc-label {
                padding: 0 18px 10px;
                font-size: 11px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                color: var(--muted);
            }

            #toc a {
                display: block;
                padding: 5px 18px;
                color: var(--muted);
                text-decoration: none;
                font-size: 13px;
                line-height: 1.45;
                border-left: 2px solid transparent;
                transition:
                    color 0.12s,
                    background 0.12s,
                    border-color 0.12s;
                word-break: break-word;
            }

            #toc a:hover {
                color: var(--text);
                background: var(--hover);
            }

            #toc a.active {
                color: var(--accent-hi);
                background: var(--surface2);
                box-shadow: inset 0 0 0 1px var(--accent);
            }

            #toc a.lvl-h2 {
                font-weight: 500;
                color: var(--text);
                margin-top: 2px;
            }

            #toc a.lvl-h3 {
                padding-left: 32px;
                font-size: 12px;
            }

            /* Content */
            #content-wrap {
                flex: 1;
                min-width: 0;
                display: flex;
                justify-content: flex-start;
                position: relative;
            }

            /* Page watermark: an oversized, faint stroke-only icon of the
               current page that spills off the bottom-right, behind the text */
            #page-watermark {
                position: fixed;
                top: var(--header-h);
                right: 0;
                bottom: 0;
                left: var(--sidebar-w);
                overflow: hidden;
                pointer-events: none;
                z-index: 0;
            }

            #page-watermark svg {
                position: absolute;
                top: 38%;
                left: 56%;
                width: 46%;
                height: auto;
                aspect-ratio: 1;
                color: color-mix(in srgb, var(--bg) 86%, var(--text2) 14%);
                opacity: 0.9;
                transform: rotate(-30deg);
                transform-origin: center;
            }

            #page-watermark svg,
            #page-watermark svg * {
                fill: none;
                stroke: currentColor;
                stroke-width: 0.5;
            }

            #content {
                width: 100%;
                max-width: var(--content-max);
                padding: 44px 52px 100px;
                min-width: 0;
                position: relative;
                z-index: 1;
            }

            /* Status / loading */
            .status {
                color: var(--muted);
                font-size: 14px;
                padding: 48px 0;
            }

            .status.loading::after {
                content: "";
                display: inline-block;
                width: 6px;
                height: 6px;
                margin-left: 6px;
                background: var(--accent);
                border-radius: 50%;
                animation: blink 1s infinite;
                vertical-align: middle;
            }

            @keyframes blink {
                0%,
                100% {
                    opacity: 0.2;
                }
                50% {
                    opacity: 1;
                }
            }

            /* Markdown typography */
            #content h1 {
                font-size: 30px;
                font-weight: 800;
                letter-spacing: -0.5px;
                color: var(--text);
                margin-bottom: 6px;
                line-height: 1.25;
            }

            /* Subtitle paragraph that immediately follows h1 */
            #content h1 + p {
                color: var(--muted);
                font-size: 15px;
                margin-bottom: 36px;
                line-height: 1.6;
            }

            #content h2 {
                font-size: 21px;
                font-weight: 700;
                color: var(--text);
                margin: 52px 0 16px;
                padding-bottom: 10px;
                border-bottom: 1px solid var(--border);
                letter-spacing: -0.2px;
            }

            #content h3 {
                font-size: 16px;
                font-weight: 600;
                color: var(--text);
                margin: 28px 0 10px;
            }

            #content h4 {
                font-size: 12px;
                font-weight: 600;
                color: var(--muted);
                text-transform: uppercase;
                letter-spacing: 0.07em;
                margin: 20px 0 8px;
            }

            #content p {
                margin-bottom: 14px;
            }

            #content ul,
            #content ol {
                margin: 0 0 14px 22px;
            }

            #content li {
                margin-bottom: 5px;
            }

            #content li > p {
                margin-bottom: 4px;
            }

            #content a {
                color: var(--accent-hi);
                text-decoration: none;
            }

            #content a:hover {
                text-decoration: underline;
                text-underline-offset: 3px;
            }

            /* Inline code */
            #content :not(pre) > code {
                font-family: var(--font-mono);
                font-size: 12.5px;
                background: var(--surface2);
                color: var(--warning);
                padding: 2px 6px;
                border-radius: var(--radius);
                border: 1px solid var(--border);
            }

            /* Code blocks */
            #content pre {
                background: var(--surface2);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 16px 18px;
                overflow-x: auto;
                margin: 4px 0 20px;
                line-height: 1.6;
            }

            #content pre code {
                background: transparent;
                border: none;
                padding: 0;
                font-family: var(--font-mono);
                font-size: 13px;
                color: inherit;
            }

            /* Tables */
            #content table {
                width: 100%;
                border-collapse: collapse;
                font-size: 14px;
                margin-bottom: 22px;
                display: block;
                overflow-x: auto;
            }

            #content th {
                text-align: left;
                padding: 8px 14px;
                background: var(--surface2);
                border: 1px solid var(--border);
                font-weight: 600;
                font-size: 12px;
                color: var(--muted);
                text-transform: uppercase;
                letter-spacing: 0.04em;
                white-space: nowrap;
            }

            #content td {
                padding: 8px 14px;
                border: 1px solid var(--border);
                vertical-align: top;
                line-height: 1.55;
            }

            #content tbody tr:hover td {
                background: rgba(255, 255, 255, 0.025);
            }

            /* Blockquotes */
            #content blockquote {
                border-left: 3px solid var(--accent);
                margin: 0 0 16px;
                padding: 4px 0 4px 18px;
                color: var(--muted);
                font-style: italic;
            }

            #content blockquote p {
                margin-bottom: 0;
            }

            /* Horizontal rule */
            #content hr {
                border: none;
                border-top: 1px solid var(--border);
                margin: 44px 0;
            }

            /* Strong / em */
            #content strong {
                color: var(--text);
                font-weight: 600;
            }

            /* Highlight.js override */
            .hljs {
                background: transparent !important;
            }

            /* Anchor-jump offset so a targeted heading clears the fixed header */
            #content :is(h1, h2, h3, h4)[id] {
                scroll-margin-top: 72px;
            }

            /* Sidebar nav tree */
            .nav-group-label {
                padding: 18px 18px 6px;
                font-size: 11px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                color: var(--muted);
            }

            #toc a.nav-page {
                font-weight: 600;
                color: var(--text);
            }

            #toc a.nav-page.active-page {
                color: var(--accent-hi);
                border-left-color: var(--accent);
                background: var(--accent-glow);
            }

            #toc .page-toc a {
                font-size: 12px;
                padding-top: 3px;
                padding-bottom: 3px;
            }

            #toc .page-toc a.lvl-h3 {
                padding-left: 34px;
            }

            .repo-link {
                padding: 5px 14px;
                border: 1px solid var(--border);
                border-radius: var(--radius);
                background: var(--bg);
                color: var(--muted);
                font-size: 13px;
                font-weight: 500;
                text-decoration: none;
                transition:
                    color 0.15s,
                    border-color 0.15s;
            }

            .repo-link:hover {
                color: var(--text);
                border-color: var(--accent);
            }

            /* Scrollbar */
            ::-webkit-scrollbar {
                width: 6px;
                height: 6px;
            }
            ::-webkit-scrollbar-track {
                background: transparent;
            }
            ::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: var(--radius);
            }
            ::-webkit-scrollbar-thumb:hover {
                background: var(--muted);
            }

            /* Search */
            #search-wrap {
                position: relative;
                max-width: 280px;
                width: 100%;
            }

            #search-input {
                width: 100%;
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 6px 12px 6px 30px;
                font-size: 13px;
                color: var(--text);
                outline: none;
                transition: border-color 0.15s;
                font-family: inherit;
            }

            #search-input::placeholder {
                color: var(--muted);
            }

            #search-input:focus {
                border-color: var(--accent);
            }

            #search-icon {
                position: absolute;
                left: 9px;
                top: 50%;
                transform: translateY(-50%);
                color: var(--muted);
                pointer-events: none;
                font-size: 14px;
                line-height: 1;
            }

            #search-results {
                display: none;
                position: absolute;
                top: calc(100% + 6px);
                left: 0;
                right: 0;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                z-index: 300;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
                max-height: 380px;
                overflow-y: auto;
            }

            #search-results.open {
                display: block;
            }

            .sr {
                padding: 9px 13px;
                cursor: pointer;
                border-bottom: 1px solid var(--border);
                transition: background 0.1s;
            }

            .sr:last-child {
                border-bottom: none;
            }

            .sr:hover,
            .sr.focused {
                background: var(--accent-glow);
            }

            .sr-title {
                font-size: 13px;
                font-weight: 500;
                color: var(--text);
                margin-bottom: 2px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .sr-title mark {
                background: transparent;
                color: var(--accent-hi);
                font-weight: 700;
            }

            .sr-context {
                font-size: 12px;
                color: var(--muted);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .sr-context mark {
                background: transparent;
                color: var(--accent-hi);
            }

            .sr-empty {
                padding: 14px;
                font-size: 13px;
                color: var(--muted);
                text-align: center;
            }

            /* Mobile */
            @media (max-width: 800px) {
                #sidebar {
                    display: none;
                }
                #search-wrap {
                    max-width: 160px;
                }
                #content {
                    padding: 28px 20px 80px;
                }
                #content h1 {
                    font-size: 24px;
                }
                #content h2 {
                    font-size: 18px;
                }
            }
        </style>
    </head>

    <body>

        <div id="header">

        <!-- Body -->
        <div id="layout">

                <div id="toc-label">Documentation</div>

            <div id="content-wrap">

        <script>
            // Navigation model
            //
            // Each page is a markdown file fetched from GitHub raw on demand, so updating
            // docs stays "push a .md file." Adding a page means adding an entry here.
            //
            const DOCS_BASE =
                "https://raw.githubusercontent.com/mudbourn/mudscript/main/docs";

            const NAV = [
                {
                    group: "Reference (macOS)",
                    pages: [
                        { slug: "writing-macros", title: "Writing Macros", file: "mac/writing-macros.md" },
                        { slug: "input", title: "Input: Keyboard, Mouse & Camera", file: "mac/input.md" },
                        { slug: "timing-state", title: "Timing, State & Control", file: "mac/timing-state.md" },
                        { slug: "audio", title: "Audio", file: "mac/audio.md" },
                        { slug: "modes-profiles", title: "Settings, Modes & Profiles", file: "mac/modes-profiles.md" },
                        { slug: "utilities", title: "Utility Functions, Hotkeys & Constants", file: "mac/utilities.md" },
                        { slug: "system", title: "System Integrity & Settings API", file: "mac/system.md" },
                        { slug: "theme-dev", title: "Theme, Capabilities & Developer Tools", file: "mac/theme-dev.md" },
                        { slug: "key-codes", title: "Key Codes", file: "KEY_CODES.md" },
                    ],
                },
                {
                    group: "Guide",
                    pages: [
                        { slug: "trust", title: "Is mudscript safe?", file: "TRUST.md" },
                    ],
                },
                {
                    group: "Project",
                    pages: [
                        { slug: "architecture", title: "Architecture", file: "ARCHITECTURE.md" },
                    ],
                },
            ];

            const PAGES = {};
            NAV.forEach((g) => g.pages.forEach((p) => (PAGES[p.slug] = p)));
            const DEFAULT_SLUG = NAV[0].pages[0].slug;

            let currentSlug = null;
            let scrollSpy = null;

            // Slug + id helpers
            function slugify(text) {
                return text
                    .toLowerCase()
                    .replace(/[^a-z0-9]+/g, "-")
                    .replace(/^-|-$/g, "");
            }

            // Assigns stable, text-derived ids so search anchors match rendered anchors.
            function assignHeadingIds(root) {
                const used = {};
                root.querySelectorAll("h2, h3, h4").forEach((h) => {
                    let base = slugify(h.textContent) || "section";
                    used[base] = (used[base] || 0) + 1;
                    h.id = used[base] > 1 ? base + "-" + used[base] : base;
                });
            }

            // Routing
            function currentRoute() {
                const slug =
                    new URLSearchParams(location.search).get("p") ||
                    DEFAULT_SLUG;
                return {
                    slug: PAGES[slug] ? slug : DEFAULT_SLUG,
                    anchor: location.hash ? location.hash.slice(1) : null,
                };
            }

            function navigate(slug, anchor, push) {
                const u = new URL(location.href);
                u.searchParams.set("p", slug);
                u.hash = anchor ? "#" + anchor : "";
                if (push) history.pushState(null, "", u);
                else history.replaceState(null, "", u);
                render(slug, anchor);
            }

            // Fetch + render
            function fetchMarkdown(slug) {
                const page = PAGES[slug];
                return fetch(DOCS_BASE + "/" + page.file).then((r) => {
                    if (!r.ok) throw new Error("HTTP " + r.status + " - " + r.url);
                    return r.text();
                });
            }

            // Page chrome: titlebar name + watermark icon, mirroring the shell
            const SVG = (paths) =>
                '<svg viewBox="0 0 24 24">' + paths + "</svg>";
            const PAGE_META = {
                "writing-macros": { name: "writing macros", icon: SVG('<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>') },
                input: { name: "input", icon: SVG('<path d="M7 9.5L2 12l9.642 4.821c.131.066.197.099.266.111a.5.5 0 0 0 .184 0c.069-.012.135-.045.266-.111L22 12l-5-2.5M7 14.5L2 17l9.642 4.821c.131.066.197.099.266.111a.5.5 0 0 0 .184 0c.069-.012.135-.045.266-.111L22 17l-5-2.5M2 7l9.642-4.821c.131-.066.197-.099.266-.111a.5.5 0 0 1 .184 0c.069.012.135.045.266.111L22 7l-9.642 4.821c-.131.066-.197.099-.266.111a.5.5 0 0 1-.184 0c-.069-.012-.135-.045-.266-.111L2 7Z"/>') },
                "timing-state": { name: "timing & state", icon: SVG('<path d="M12 13V9M21 6L19 4M10 2H14M12 21C7.582 21 4 17.418 4 13C4 8.582 7.582 5 12 5C16.418 5 20 8.582 20 13C20 17.418 16.418 21 12 21Z"/>') },
                audio: { name: "audio", icon: SVG('<path d="M19 6C20.5 7.5 21 10 21 12C21 14 20.5 16.5 19 18M16 9C16.5 9.5 17 10.5 17 12C17 13.5 16.5 14.5 16 15M3 10.5V13.5C3 14.605 3.5 15.5 5.5 16C7.5 16.5 9 21 12 21C14 21 14 3 12 3C9 3 7.5 7.5 5.5 8C3.5 8.5 3 9.395 3 10.5Z"/>') },
                "modes-profiles": { name: "settings & modes", icon: SVG('<path d="M2 21a8 8 0 0 1 10.821-7.487"/><path d="M21.378 16.626a1 1 0 0 0-3.004-3.004l-4.01 4.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/><circle cx="10" cy="8" r="5"/>') },
                utilities: { name: "utilities", icon: SVG('<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z"/>') },

                "key-codes": { name: "key codes", icon: SVG('<path d="M6 13H6.01M6 17H6.01M10 13H10.01M14 13H14.01M18 17H18.01M18 13H18.01M16 3V5H8V9M10 17H14M5.2 21H18.8C19.92 21 20.48 21 20.908 20.782C21.284 20.59 21.59 20.284 21.782 19.908C22 19.48 22 18.92 22 17.8V12.2C22 11.08 22 10.52 21.782 10.092C21.59 9.716 21.284 9.41 20.908 9.218C20.48 9 19.92 9 18.8 9H5.2C4.08 9 3.52 9 3.092 9.218C2.716 9.41 2.41 9.716 2.218 10.092C2 10.52 2 11.08 2 12.2V17.8C2 18.92 2 19.48 2.218 19.908C2.41 20.284 2.716 20.59 3.092 20.782C3.52 21 4.08 21 5.2 21Z"/>') },
                trust: { name: "trust", icon: SVG('<path d="M11.302 21.615C11.523 21.744 11.634 21.809 11.79 21.842C11.912 21.868 12.088 21.868 12.21 21.842C12.366 21.809 12.477 21.744 12.698 21.615C14.646 20.478 20 16.908 20 12V6.6C20 6.042 20 5.763 19.893 5.55C19.797 5.362 19.649 5.212 19.461 5.114C19.25 5.004 18.966 5.001 18.399 4.994C15.427 4.959 13.714 4.714 12 3C10.286 4.714 8.573 4.959 5.601 4.994C5.034 5.001 4.75 5.004 4.539 5.114C4.351 5.212 4.203 5.362 4.107 5.55C4 5.763 4 6.042 4 6.6V12C4 16.908 9.354 20.478 11.302 21.615Z"/>') },
                architecture: { name: "architecture", icon: SVG('<path d="M3 17V7C3 5.895 3.895 5 5 5H19C20.105 5 21 5.895 21 7V17C21 18.105 20.105 19 19 19H5C3.895 19 3 18.105 3 17Z"/><path d="M6 8.01L6.01 7.999"/><path d="M8 8.01L8.01 7.999"/><path d="M10 8.01L10.01 7.999"/>') },
            };

            function setPageChrome(slug) {
                const meta = PAGE_META[slug];
                const nameEl = document.getElementById("brand-page");
                if (nameEl) nameEl.textContent = meta ? meta.name : "documentation";
                const wm = document.getElementById("page-watermark");
                if (wm) wm.innerHTML = meta ? meta.icon : "";
                document.title = "mudscript :// " + (meta ? meta.name : "documentation");
            }

            function render(slug, anchor) {
                if (slug === currentSlug) {
                    if (anchor) scrollToAnchor(anchor);
                    return;
                }
                currentSlug = slug;
                setPageChrome(slug);

                const content = document.getElementById("content");
                content.innerHTML =
                    '<p class="status loading">Loading documentation</p>';
                if (scrollSpy) {
                    scrollSpy.disconnect();
                    scrollSpy = null;
                }

                fetchMarkdown(slug)
                    .then((md) => {
                        content.innerHTML = marked.parse(md);
                        assignHeadingIds(content);
                        content
                            .querySelectorAll("pre code")
                            .forEach((el) => hljs.highlightElement(el));
                        buildSidebar(slug);
                        initScrollSpy();
                        document
                            .getElementById("content-wrap")
                            .scrollTo?.(0, 0);
                        window.scrollTo(0, 0);
                        if (anchor) scrollToAnchor(anchor);
                    })
                    .catch((err) => {
                        content.innerHTML =
                            "<h1>Failed to load</h1><p>" +
                            err.message +
                            "</p><p>Make sure the page is published to the repository.</p>";
                    });
            }

            function scrollToAnchor(id) {
                const el = document.getElementById(id);
                if (el)
                    setTimeout(
                        () =>
                            el.scrollIntoView({
                                behavior: "smooth",
                                block: "start",
                            }),
                        60,
                    );
            }

            // Sidebar
            function buildSidebar(activeSlug) {
                const toc = document.getElementById("toc");
                toc.innerHTML = "";

                NAV.forEach((group) => {
                    const label = document.createElement("div");
                    label.className = "nav-group-label";
                    label.textContent = group.group;
                    toc.appendChild(label);

                    group.pages.forEach((page) => {
                        const a = document.createElement("a");
                        a.href = "?p=" + page.slug;
                        a.className = "nav-page";
                        a.textContent = page.title;
                        if (page.slug === activeSlug)
                            a.classList.add("active-page");
                        a.addEventListener("click", (e) => {
                            e.preventDefault();
                            navigate(page.slug, null, true);
                        });
                        toc.appendChild(a);

                        if (page.slug === activeSlug)
                            appendPageToc(toc, page.slug);
                    });
                });
            }

            function appendPageToc(toc, slug) {
                const content = document.getElementById("content");
                const headings = [...content.querySelectorAll("h2, h3")];
                if (!headings.length) return;

                const box = document.createElement("div");
                box.className = "page-toc";

                headings.forEach((h) => {
                    const a = document.createElement("a");
                    a.href = "?p=" + slug + "#" + h.id;
                    a.className = "lvl-" + h.tagName.toLowerCase();
                    a.textContent = h.textContent;
                    a.addEventListener("click", (e) => {
                        e.preventDefault();
                        navigate(slug, h.id, true);
                    });
                    box.appendChild(a);
                });

                toc.appendChild(box);
            }

            // Scroll spy
            function initScrollSpy() {
                const links = document.querySelectorAll("#toc .page-toc a");
                const headings = document.querySelectorAll(
                    "#content h2, #content h3",
                );
                if (!links.length) return;

                scrollSpy = new IntersectionObserver(
                    (entries) => {
                        entries.forEach((entry) => {
                            if (!entry.isIntersecting) return;
                            links.forEach((l) => l.classList.remove("active"));
                            const active = document.querySelector(
                                '#toc .page-toc a[href$="#' + entry.target.id + '"]',
                            );
                            if (active) {
                                active.classList.add("active");
                                active.scrollIntoView({
                                    block: "nearest",
                                });
                            }
                        });
                    },
                    { rootMargin: "-8% 0px -82% 0px", threshold: 0 },
                );

                headings.forEach((h) => scrollSpy.observe(h));
            }

            // Search (across every page)
            let searchIndex = [];
            let searchReady = false;
            let searchFocusIdx = -1;

            function buildSearchIndex() {
                const slugs = Object.keys(PAGES);
                Promise.all(
                    slugs.map((slug) =>
                        fetchMarkdown(slug)
                            .then((md) => ({ slug, md }))
                            .catch(() => null),
                    ),
                ).then((docs) => {
                    const scratch = document.createElement("div");
                    docs.forEach((doc) => {
                        if (!doc) return;
                        scratch.innerHTML = marked.parse(doc.md);
                        assignHeadingIds(scratch);
                        indexOnePage(doc.slug, PAGES[doc.slug].title, scratch);
                    });
                    searchReady = true;
                });
            }

            function indexOnePage(slug, pageTitle, root) {
                let curHeading = null;
                let curId = null;

                root.querySelectorAll("h2, h3, h4, p, li").forEach((el) => {
                    const tag = el.tagName.toLowerCase();
                    const text = el.textContent.trim();
                    if (!text) return;

                    if (tag === "h2" || tag === "h3") {
                        curHeading = text;
                        curId = el.id;
                        searchIndex.push({
                            type: "heading",
                            title: text,
                            context: pageTitle,
                            slug,
                            id: el.id,
                            lc: text.toLowerCase(),
                        });
                    } else if (tag === "h4") {
                        searchIndex.push({
                            type: "heading",
                            title: text,
                            context: curHeading || pageTitle,
                            slug,
                            id: curId,
                            lc: text.toLowerCase(),
                        });
                    } else if (curId) {
                        searchIndex.push({
                            type: "content",
                            title: curHeading || pageTitle,
                            context: text.slice(0, 90),
                            slug,
                            id: curId,
                            lc: text.toLowerCase(),
                        });
                    }
                });

                root.querySelectorAll(":not(pre) > code").forEach((el) => {
                    const text = el.textContent.trim();
                    const heading = el.closest("h2, h3, h4");
                    if (!text) return;
                    searchIndex.push({
                        type: "code",
                        title: text,
                        context: pageTitle,
                        slug,
                        id: heading ? heading.id : null,
                        lc: text.toLowerCase(),
                    });
                });
            }

            function runSearch(query) {
                if (!query || query.length < 2) return [];
                const q = query.toLowerCase();
                const seen = new Set();
                const results = [];

                searchIndex.forEach((entry) => {
                    if (!entry.lc.includes(q)) return;
                    const key = entry.slug + "|" + entry.id + "|" + entry.title;
                    if (seen.has(key)) return;
                    seen.add(key);
                    results.push(entry);
                });

                results.sort((a, b) => {
                    const aExact = a.lc === q;
                    const bExact = b.lc === q;
                    if (aExact !== bExact) return aExact ? -1 : 1;
                    const rank = { heading: 0, code: 1, content: 2 };
                    return (rank[a.type] || 2) - (rank[b.type] || 2);
                });

                return results.slice(0, 9);
            }

            function hl(text, query) {
                const idx = text.toLowerCase().indexOf(query.toLowerCase());
                if (idx === -1) return text;
                return (
                    text.slice(0, idx) +
                    "<mark>" +
                    text.slice(idx, idx + query.length) +
                    "</mark>" +
                    text.slice(idx + query.length)
                );
            }

            function renderResults(results, query) {
                const box = document.getElementById("search-results");
                searchFocusIdx = -1;

                if (!results.length) {
                    box.innerHTML =
                        '<div class="sr-empty">' +
                        (searchReady ? "No results" : "Indexing...") +
                        "</div>";
                    box.classList.add("open");
                    return;
                }

                box.innerHTML = results
                    .map(
                        (r, i) =>
                            '<div class="sr" data-slug="' +
                            r.slug +
                            '" data-id="' +
                            (r.id || "") +
                            '" data-i="' +
                            i +
                            '"><div class="sr-title">' +
                            hl(r.title, query) +
                            "</div>" +
                            (r.context
                                ? '<div class="sr-context">' +
                                  hl(r.context, query) +
                                  "</div>"
                                : "") +
                            "</div>",
                    )
                    .join("");
                box.classList.add("open");

                box.querySelectorAll(".sr").forEach((el) => {
                    el.addEventListener("mousedown", (e) => {
                        e.preventDefault();
                        goToResult(el.dataset.slug, el.dataset.id);
                    });
                });
            }

            function goToResult(slug, id) {
                closeSearch();
                document.getElementById("search-input").blur();
                navigate(slug, id || null, true);
            }

            function closeSearch() {
                document.getElementById("search-results").classList.remove("open");
            }

            function initSearch() {
                const input = document.getElementById("search-input");
                const box = document.getElementById("search-results");

                input.addEventListener("input", () => {
                    const q = input.value.trim();
                    if (q.length < 2) {
                        closeSearch();
                        return;
                    }
                    renderResults(runSearch(q), q);
                });

                input.addEventListener("keydown", (e) => {
                    const items = [...box.querySelectorAll(".sr")];
                    if (e.key === "ArrowDown") {
                        e.preventDefault();
                        searchFocusIdx = Math.min(
                            searchFocusIdx + 1,
                            items.length - 1,
                        );
                    } else if (e.key === "ArrowUp") {
                        e.preventDefault();
                        searchFocusIdx = Math.max(searchFocusIdx - 1, 0);
                    } else if (e.key === "Enter") {
                        const f = items[searchFocusIdx];
                        if (f) goToResult(f.dataset.slug, f.dataset.id);
                        return;
                    } else if (e.key === "Escape") {
                        closeSearch();
                        input.blur();
                        return;
                    } else {
                        return;
                    }
                    items.forEach((el, i) =>
                        el.classList.toggle("focused", i === searchFocusIdx),
                    );
                    items[searchFocusIdx]?.scrollIntoView({ block: "nearest" });
                });

                input.addEventListener("blur", () =>
                    setTimeout(closeSearch, 160),
                );

                document.addEventListener("keydown", (e) => {
                    if (
                        e.key === "/" &&
                        document.activeElement !== input &&
                        document.activeElement.tagName !== "INPUT"
                    ) {
                        e.preventDefault();
                        input.focus();
                        input.select();
                    }
                });
            }

            // In-content link interception
            function initContentLinks() {
                document.getElementById("content").addEventListener("click", (e) => {
                    const a = e.target.closest("a");
                    if (!a) return;
                    const href = a.getAttribute("href") || "";
                    const m = href.match(/^\?p=([\w-]+)(?:#([\w-]+))?$/);
                    if (m && PAGES[m[1]]) {
                        e.preventDefault();
                        navigate(m[1], m[2] || null, true);
                        return;
                    }
                    if (href.startsWith("#")) {
                        e.preventDefault();
                        navigate(currentSlug, href.slice(1), true);
                    }
                });
            }

            // Init
            marked.setOptions({ gfm: true, breaks: false });

            initSearch();
            initContentLinks();
            buildSearchIndex();

            window.addEventListener("popstate", () => {
                const r = currentRoute();
                render(r.slug, r.anchor);
            });

            (function boot() {
                const r = currentRoute();
                render(r.slug, r.anchor);
            })();
        </script>
    </body>
