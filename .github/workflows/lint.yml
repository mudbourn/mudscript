name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint against baseline
        run: node bin/lint.mjs --base ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
