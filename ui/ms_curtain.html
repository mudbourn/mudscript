<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>mudscript — Exit</title>
        <style>
            /* -- Font -- */
            @font-face {
                font-family: "Almendra";
                src: url("./fonts/Almendra-Regular.ttf") format("truetype");
                font-weight: 400;
                font-style: normal;
                font-display: swap;
            }
            @font-face {
                font-family: "Almendra";
                src: url("./fonts/Almendra-Bold.ttf") format("truetype");
                font-weight: 700;
                font-style: normal;
                font-display: swap;
            }

            /* -- Tokens -- */
            /* Same names and same defaults as ms_loading.html, so a theme that
               dresses the boot screen dresses the exit without a second pass.
               applyTheme() below takes the same payload as the loading screen's. */
            :root {
                --bg: #0d0f09;
                --surface: #141810;
                --surface2: #1c2116;
                --hover: #2d3523;
                --accent: #6b8c3a;
                --accent-hi: #8db84e;
                --warning: #c4a030;
                --text: #d4cfb6;
                --radius: 8px;
                --ms-window-radius: 8px;
                --font: Arial, "Almendra", sans-serif;
            }

            /* -- Reset -- */
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                user-select: none;
                -webkit-user-select: none;
            }
            html,
            body {
                height: 100%;
                overflow: hidden;
                background: transparent;
                font-family: var(--font);
                font-size: 13px;
                color: var(--text);
                -webkit-font-smoothing: antialiased;
                cursor: none;
            }

            /* -- Curtain -- */
            /* Dressed as the shell's own window, same --bg, same
               --ms-window-radius, no border, exactly like #shell-root, because
               it stands in that window's place. The host sizes this page to the
               shell's frame, so the takeover looks like the shell going quiet
               rather than a new window appearing.
               The whole sheet fades as one, and it outlives the shell, so the
               desktop is never revealed mid send-off. */
            #curtain {
                position: fixed;
                inset: 0;
                background: var(--bg);
                border-radius: var(--ms-window-radius, 0px);
                overflow: hidden;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 16px;
                opacity: 0;
                transition: opacity 0.35s ease;
            }
            #curtain.visible {
                opacity: 1;
            }

            /* The mark and wording ride in together, slightly behind the sheet,
               so the curtain reads as arriving rather than cutting. */
            #block {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 14px;
                opacity: 0;
                transform: scale(0.96);
                transition:
                    opacity 0.45s ease 0.12s,
                    transform 0.45s cubic-bezier(0.4, 0, 0.2, 1) 0.12s;
            }

            /* Going out, everything leaves together and immediately: the
               staggered delays above are an entrance, and replaying them in
               reverse would hold the mark on screen after the sheet beneath it
               had already gone. */
            #curtain.leaving,
            #curtain.leaving #block,
            #curtain.leaving #brand {
                transition-delay: 0s;
            }
            #curtain.visible #block {
                opacity: 1;
                transform: scale(1);
            }

            /* -- Mark -- */
            #mark {
                color: var(--accent);
                animation: mark-pulse 1.4s ease-in-out infinite;
            }
            #mark svg {
                width: 34px;
                height: 34px;
                display: block;
            }
            @keyframes mark-pulse {
                0%,
                100% {
                    opacity: 0.9;
                }
                50% {
                    opacity: 0.35;
                }
            }

            /* Restart's mark turns once on the way in, the one place the two
               modes differ beyond wording, because a reload is a cycle and a
               shutdown is not. */
            #curtain.restart.visible #mark svg {
                animation: mark-turn 0.9s cubic-bezier(0.4, 0, 0.2, 1) 0.12s 1;
            }
            @keyframes mark-turn {
                from {
                    transform: rotate(-180deg);
                }
                to {
                    transform: rotate(0deg);
                }
            }

            /* -- Wording -- */
            #text {
                font-size: 12px;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: var(--text);
                opacity: 0.72;
            }

            /* -- Force button -- */
            /* Hidden until the send-off has been on screen past its 3s window,
               so it only ever offers itself on a stall. Clicking it runs the
               host's graceful force sequence. */
            #force {
                display: none;
                margin-top: 4px;
                padding: 6px 14px;
                font-family: var(--font);
                font-size: 11px;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: var(--text);
                background: transparent;
                border: 1px solid var(--warning);
                border-radius: var(--radius);
                cursor: pointer;
            }
            #curtain.showforce {
                cursor: default;
            }
            #curtain.showforce #force {
                display: inline-block;
                opacity: 0.85;
                animation: force-in 0.3s ease;
            }
            #force:hover {
                background: var(--hover);
                opacity: 1;
            }
            #force:disabled {
                opacity: 0.5;
                cursor: default;
            }
            @keyframes force-in {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 0.85;
                }
            }

            /* -- Brand -- */
            /* The loading screen opens on this word; the exit closes on it. */
            #brand {
                position: absolute;
                bottom: 18px;
                left: 0;
                right: 0;
                text-align: center;
                /* No font-family of its own: the loading screen's brand
                   inherits --font, and pinning "Almendra" first here meant a
                   theme font could never reach the one word both screens
                   share. */
                font-size: 15px;
                font-weight: 700;
                color: var(--text);
                opacity: 0;
                /* Lands at 0.6s, same as the block, the host holds the shell
                   open for exactly that long, so nothing in the entrance may
                   finish after it. */
                transition: opacity 0.4s ease 0.2s;
            }
            #curtain.visible #brand {
                opacity: 0.28;
            }

            /* -- Octane -- */
            /* Octane snaps, as everywhere. Host adds this before .visible. */
            #curtain.octane,
            #curtain.octane #block,
            #curtain.octane #brand {
                transition: none;
            }
            #curtain.octane #mark,
            #curtain.octane #mark svg {
                animation: none;
            }
        </style>
    </head>
    <body>
        <div id="curtain">
            <div id="block">
                <div id="mark"></div>
                <div id="text">Shutting down...</div>
                <button id="force" type="button">Force shutdown</button>
            </div>
            <div id="brand">mudscript</div>
        </div>

        <script>
            /* -- Host communication -- */
            function sendToHost(msg) {
                const s = JSON.stringify(msg);
                if (window.chrome && window.chrome.webview)
                    window.chrome.webview.postMessage(s);
                else if (
                    window.webkit &&
                    window.webkit.messageHandlers &&
                    window.webkit.messageHandlers.curtain
                )
                    window.webkit.messageHandlers.curtain.postMessage(s);
            }

            /* -- Theme injection -- */
            /* Byte-for-byte the loading screen's applyTheme, on purpose: the two
               screens drift the moment they read the theme differently. */
            function applyTheme(t) {
                if (!t) return;
                const r = document.documentElement.style;
                if (t.bg) r.setProperty("--bg", t.bg);
                if (t.surface) r.setProperty("--surface", t.surface);
                if (t.surface2) r.setProperty("--surface2", t.surface2);
                if (t.hover) r.setProperty("--hover", t.hover);
                if (t.accent) r.setProperty("--accent", t.accent);
                if (t.accentHi) r.setProperty("--accent-hi", t.accentHi);
                if (t.warning) r.setProperty("--warning", t.warning);
                if (t.text) r.setProperty("--text", t.text);
                if (t.radius !== undefined)
                    r.setProperty("--radius", t.radius + "px");
                if (t.windowRadius !== undefined)
                    r.setProperty("--ms-window-radius", t.windowRadius + "px");
                if (t.font)
                    r.setProperty(
                        "--font",
                        t.font + ', "Almendra", Arial, sans-serif',
                    );
            }

            /* -- Modes -- */
            const MODES = {
                shutdown: {
                    text: "Shutting down...",
                    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></svg>',
                },
                restart: {
                    text: "Restarting...",
                    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>',
                },
            };

            /* -- Show -- */
            function showCurtain(mode, octane) {
                const spec = MODES[mode] || MODES.shutdown;
                const cu = document.getElementById("curtain");
                document.getElementById("mark").innerHTML = spec.icon;
                document.getElementById("text").textContent = spec.text;
                cu.classList.remove("shutdown", "restart");
                cu.classList.add(MODES[mode] ? mode : "shutdown");
                if (octane) cu.classList.add("octane");

                const forceBtn = document.getElementById("force");
                forceBtn.textContent = "Force " + (MODES[mode] ? mode : "shutdown");
                if (!forceBtn._wired) {
                    forceBtn._wired = true;
                    forceBtn.addEventListener("click", function () {
                        forceBtn.disabled = true;
                        sendToHost({ action: "forceExit" });
                    });
                }
                /* Force a reflow so the transition has a settled 0 state to
                   run from, setting both states in one go skips the fade.
                   Deliberately not requestAnimationFrame: a webview that is
                   not foregrounded throttles rAF, and a curtain that waits for
                   a frame that never comes is a curtain that never appears. */
                /* The send-off is started from here, not from the host side of
                   the call that got us here. evaluateJavaScript is async: it
                   returns the instant it is dispatched, so a sound played next
                   to it starts while this function is still queued, which is
                   how the sound first got ahead of the fade.

                   Running is still not the same as being on screen, though.
                   The host shows the window and calls straight into this, and
                   the page can run before the window server has put a single
                   pixel up, so reporting immediately just moved the gap.

                   requestAnimationFrame is the fix: it does not fire until the
                   window is actually compositing. So the fade and the send-off
                   both start on a frame that is provably being drawn.

                   The catch is that this page has been sitting in a hidden
                   window since boot, and a hidden WKWebView has its rendering
                   updates suspended, rAF does not tick at all. Showing the
                   window resumes them, but not on the next frame and not
                   within any bounded time: on a cold view it is regularly
                   several hundred milliseconds. Two frames apart in wall-clock
                   time is what proves the display link is really running
                   again, rather than one resume-tick fired on its own. */
                let started = false;
                const go = function () {
                    if (started) return;
                    started = true;
                    void cu.offsetWidth;
                    cu.classList.add("visible");
                    sendToHost({ action: "fading" });
                    setTimeout(function () {
                        cu.classList.add("showforce");
                    }, 3500);
                };

                /* Octane has no fade to align to. */
                if (octane) return go();

                let seen = 0;
                let last = 0;
                const tick = function (t) {
                    if (started) return;
                    if (last && t > last) seen++;
                    last = t;
                    if (seen >= 2) return go();
                    requestAnimationFrame(tick);
                };
                requestAnimationFrame(tick);

                /* A window that never composites never fires rAF at all, so
                   there still has to be a floor. It is deliberately far longer
                   than the resume normally takes: this is the "the page is
                   dead" case, not a race the common path is allowed to lose.
                   A short stop here is exactly how the send-off got ahead of
                   the fade, it beat the compositor rather than backing it up.
                   Kept under the host's own fallback so the page, not the
                   host, is what gives up first. */
                setTimeout(go, 1000);
            }

            /* -- Hide -- */
            /* The host calls this and then waits out the fade before it kills
               or reloads. Reversing .visible is enough, every transition here
               is symmetric, so the sheet, the block and the brand all wind
               back down the way they came up. */
            function hideCurtain() {
                const cu = document.getElementById("curtain");
                cu.classList.add("leaving");
                void cu.offsetWidth;
                cu.classList.remove("visible");
            }

            /* -- Suppress context menu -- */
            document.addEventListener("contextmenu", (e) => e.preventDefault());

            /* -- Page-ready handshake -- */
            /* The host holds the teardown until this lands. Without it the
               shell closes before this page has painted and the desktop shows
               through for as long as WKWebView took to load. */
            document.addEventListener("DOMContentLoaded", function () {
                sendToHost({ action: "ready" });
            });
        </script>
    </body>
</html>
