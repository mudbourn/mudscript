<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <script src="./modules/ui-tokens.js"></script>
        <script src="./modules/icons.js"></script>
        <script src="./modules/ui-probe.js"></script>
        <style>
            button,
            input,
            textarea,
            select {
                font: inherit;
            }

            /* -- Fonts -- */

            /* -- Reset -- */
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                user-select: none;
                -webkit-user-select: none;
            }
            html,
            body {
                height: 100%;
                overflow: hidden;
                background: transparent;
            }
            body {
                font-family: var(--font);
                font-size: 13px;
                color: var(--text);
                -webkit-font-smoothing: antialiased;
                display: flex;
                flex-direction: column;
                position: relative;
                background: var(--bg);
                border-radius: var(--ms-window-radius, 3px);
                overflow: hidden;
            }
            button {
                cursor: pointer;
                border: none;
                background: none;
                color: inherit;
                font: inherit;
            }
            select {
                font: inherit;
                color: inherit;
            }

            /* -- Header -- */
            #header {
                display: flex;
                align-items: center;
                gap: 8px;
                height: 40px; padding: 0 12px;
                background: var(--surface);
                border-bottom: 1px solid var(--border);
                box-shadow: 0 1px 12px
                    color-mix(in srgb, var(--accent) 12%, transparent);
                flex-shrink: 0;
            }
            #panel-title {
                flex: 1;
                font-weight: 600;
                font-size: 13px;
            }
            .header-btns {
                display: flex;
                gap: 4px;
                -webkit-app-region: no-drag;
            }
            .btn-ghost {
                padding: 3px 10px;
                border-radius: var(--radius);
                font-size: 11px;
                font-weight: 600;
                background: var(--surface2);
                color: var(--text2);
                transition: opacity 0.15s;
            }
            .btn-ghost:hover {
                opacity: 0.8;
            }
            .btn-close {
                width: 28px; height: 28px; border-radius: var(--radius);
                background: var(--surface2); color: var(--text2);
                display: flex; align-items: center; justify-content: center;
                flex-shrink: 0;
                transition: background 0.15s;
            }
            
            .btn-close .icon { width: 14px; height: 14px; display: block; }
            .btn-close:hover {
                background: var(--hover);
                color: var(--text);
            }

            /* -- Flag row -- */
            #flag-row {
                display: flex;
                align-items: center;
                padding: 7px 12px;
                gap: 8px;
                background: var(--surface);
                border-bottom: 1px solid var(--border);
                flex-shrink: 0;
            }
            .flag-pill {
                display: flex;
                align-items: center;
                gap: 5px;
                padding: 3px 8px;
                border-radius: var(--radius);
                background: var(--surface2);
                border: 1px solid var(--border);
                font-size: 11px;
                color: var(--text2);
                transition:
                    border-color 0.2s,
                    color 0.2s;
                flex: 1;
                min-width: 0;
            }
            .flag-pill.flag-recent {
                border-color: var(--accent);
                color: var(--text);
            }
            .flag-label {
                font-size: 10px;
                font-weight: 700;
                color: var(--text3);
                text-transform: uppercase;
                letter-spacing: 0.05em;
                flex-shrink: 0;
            }
            .flag-value {
                font: 12px var(--font-mono);
                flex-shrink: 0;
            }
            .flag-detail {
                font-size: 11px;
                color: var(--text3);
                margin-left: auto;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .flag-sep {
                color: var(--border);
                font-size: 16px;
                flex-shrink: 0;
            }

            /* -- State section -- */
            .state-section {
                padding: 8px 12px;
                background: var(--surface);
                border-bottom: 1px solid var(--border);
                flex-shrink: 0;
            }
            .section-label {
                font: 700 9px var(--font-mono);
                letter-spacing: 0.1em;
                color: var(--text3);
                text-transform: uppercase;
                margin-bottom: 5px;
            }
            #keys-pills,
            #mouse-pills {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                min-height: 22px;
            }
            .pill {
                display: inline-flex;
                align-items: center;
                padding: 2px 8px;
                border-radius: var(--radius);
                font-size: 12px;
                font-family: inherit;
                white-space: nowrap;
            }
            .pill-key {
                background: color-mix(in srgb, var(--accent) 15%, transparent);
                border: 1px solid var(--accent);
                color: var(--accent);
            }
            .pill-mouse {
                background: color-mix(in srgb, var(--warning) 15%, transparent);
                border: 1px solid var(--warning);
                color: var(--warning);
            }
            .pill-empty {
                background: var(--surface2);
                border: 1px solid var(--border);
                color: var(--text2);
                opacity: 0.4;
            }

            /* -- Coord row -- */
            #coord-row {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 6px;
            }
            #pos-display {
                font: 12px var(--font-mono);
                color: var(--text2);
                flex: 1;
            }
            #coord-select-mount .macro-select {
                padding: 2px 6px;
                min-width: 0;
                flex-shrink: 0;
            }

            /* -- Section divider -- */
            .section-divider {
                height: 1px;
                background: var(--border);
                flex-shrink: 0;
            }

            /* -- Event log -- */
            .log {
                flex: 1;
                overflow-y: auto;
                padding: 4px 0;
                min-height: 0;
            }
            .log::-webkit-scrollbar {
                width: 4px;
            }
            .log::-webkit-scrollbar-track {
                background: transparent;
            }
            .log::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: 3px;
            }

            /* -- Entry rows -- */
            .entry {
                display: flex;
                align-items: flex-start;
                gap: 6px;
                padding: 5px 12px;
                font-size: 12px;
                border-bottom: 1px solid var(--border-dim);
            }
            .entry:hover {
                background: var(--surface);
            }
            .entry.selected {
                background: var(--hover);
                outline: 1px solid var(--accent-glow);
            }
            .entry.selected:hover {
                background: var(--accent-glow-faint);
            }
            .entry.move-entry {
                opacity: 0.5;
            }
            .ts {
                color: var(--text3);
                font: 10px var(--font-mono);
                flex-shrink: 0;
                padding-top: 1px;
                min-width: 52px;
            }

            /* -- Badges -- */
            .badge {
                font: 700 10px var(--font-mono);
                letter-spacing: 0.05em;
                text-transform: uppercase;
                padding: 1px 5px;
                border-radius: var(--radius-s);
                border: 1px solid transparent;
                flex-shrink: 0;
            }
            .badge-key {
                background: color-mix(in srgb, var(--key, var(--accent)) 20%, transparent);
                color: var(--key, var(--accent));
                border-color: color-mix(in srgb, var(--key, var(--accent)) 45%, transparent);
            }
            .badge-mouse {
                background: color-mix(in srgb, var(--warning) 20%, transparent);
                color: var(--warning);
                border-color: color-mix(in srgb, var(--warning) 45%, transparent);
            }
            .badge-scroll {
                background: color-mix(in srgb, var(--scroll, var(--warning)) 20%, transparent);
                color: var(--scroll, var(--warning));
            }

            /* -- Arrows -- */
            .arrow {
                flex-shrink: 0;
            }
            .arrow-down {
                color: var(--accent);
            }
            .arrow-up {
                color: var(--text2);
            }
            .arrow-mouse {
                color: var(--text);
            }
            .arrow-key {
                color: var(--text);
            }
            .arrow-key-up {
                color: var(--text2);
            }
            .arrow-scroll {
                color: var(--scroll, var(--warning));
            }
            .arrow-move {
                color: var(--text3);
            }

            /* -- Name spans -- */
            .key-name {
                color: var(--text);
                word-break: break-word;
            }
            .mouse-name {
                color: var(--text);
                word-break: break-word;
            }
            .scroll-name {
                color: var(--scroll, var(--warning));
                word-break: break-word;
            }
            .move-name {
                color: var(--text3);
                font-variant-numeric: tabular-nums;
                font-family: var(--font-mono);
            }
            .dim {
                color: var(--text3);
                font: 10px var(--font-mono);
            }

            /* -- Context menu -- */
            #ctx-menu {
                position: fixed;
                min-width: 140px;
                background: var(--surface2);
                border: 1px solid var(--border);
                border-radius: var(--radius-s);
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
                z-index: 150;
                overflow: hidden;
                display: none;
            }
            #ctx-menu.open { display: block; }
            .ctx-item {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 7px 10px;
                font-size: 12px;
                color: var(--text2);
                cursor: pointer;
                transition: background 0.1s, color 0.1s;
                user-select: none;
            }
            .ctx-item:hover {
                background: var(--hover);
                color: var(--text);
            }
            .ctx-divider {
                height: 1px;
                background: var(--border);
                margin: 2px 0;
            }
        </style>
    </head>
    <body autocapitalize="off" autocorrect="off" spellcheck="false">
    <script>
    (function() {
        document.addEventListener('keydown', function(e) {
            if (msMod(e) && (e.key === 'p' || e.key === 'P')) e.preventDefault();
        }, true);
        try { window.print = function() {}; } catch (e) {}
        document.addEventListener('focusin', function(e) {
            var t = e.target;
            if (!t) return;
            if (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable) {
                t.setAttribute('autocapitalize', 'off');
                t.setAttribute('autocorrect', 'off');
                t.setAttribute('spellcheck', 'false');
                if (t.tagName === 'INPUT' && !t.hasAttribute('autocomplete')) t.setAttribute('autocomplete', 'off');
            }
        });
    })();
    </script>
        <div id="header">
            <span id="panel-title">mudscript :// input monitor</span>
            <div class="header-btns">
                <button
                    id="pause-btn"
                    class="btn-ghost"
                    onmouseenter="playSlot('hover')"
                    onclick="
                        playSlot('interact');
                        togglePause();
                    "
                >
                    Pause
                </button>
                <button
                    class="btn-ghost"
                    onmouseenter="playSlot('hover')"
                    onclick="
                        playSlot('interact');
                        clearLog();
                    "
                >
                    Clear
                </button>
                <button
                    class="btn-close"
                    onmouseenter="playSlot('hover')"
                    onclick="
                        playSlot('back');
                        closePanel();
                    "
                >
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 12h8"/></svg>
                </button>
            </div>
        </div>

        <!-- Flag row: most-recent key / mouse-button indicator -->
        <div id="flag-row">
            <div class="flag-pill" id="flag-key-pill" data-flag-label="Key"></div>
            <span class="flag-sep">|</span>
            <div class="flag-pill" id="flag-mouse-pill" data-flag-label="Mouse"></div>
        </div>

        <!-- Tab bar -->
        <div id="tabs">
            <button
                id="tab-keys"
                class="tab active"
                onmouseenter="playSlot('hover')"
                onclick="playSlot('interact'); switchTab('keys')"
            >
                Keyboard
            </button>
            <button
                id="tab-mouse"
                class="tab"
                onmouseenter="playSlot('hover')"
                onclick="playSlot('interact'); switchTab('mouse')"
            >
                Mouse
            </button>
        </div>

        <!-- -- Keyboard tab -- -->
        <div id="keys-section" class="tab-section active">
            <div class="state-section">
                <div class="section-label">Active</div>
                <div id="keys-pills"></div>
            </div>
            <div class="section-divider"></div>
            <div id="keys-log" class="log"></div>
        </div>

        <!-- -- Mouse tab -- -->
        <div id="mouse-section" class="tab-section">
            <div class="state-section">
                <div class="section-label">Position</div>
                <div id="coord-row">
                    <div id="pos-display">
                        x:&nbsp;<span id="mx-display">-</span
                        >&nbsp;&nbsp;y:&nbsp;<span id="my-display">-</span>
                    </div>
                    <span id="coord-select-mount"></span>
                </div>
                <div id="mouse-pills"></div>
            </div>
            <div class="section-divider"></div>
            <div id="mouse-log" class="log"></div>
        </div>

        <div id="ctx-menu"></div>

        <script src="./modules/ui-select.js"></script>
        <script src="./modules/devfmt.js"></script>
        <script src="./modules/ui-tabs.js"></script>
        <script src="./modules/log-panel.js"></script>
        <script src="./modules/ui-glyphs.js"></script>
        <script src="./modules/osk.js"></script>
        <script src="./modules/gp-nav.js"></script>
        <script>
            window.installGpNav({
                scope: function() { return document.body; },
                panelKey: function() { return 'keys'; },
                sound: function(slot) { if (window.playSlot) window.playSlot(slot); },
                closeRoot: function() { if (window.closePanel) window.closePanel(); },
            });
        </script>
        <script>
            "use strict";

            // -- Create LogPanel (selection, context menu, keyboard, drag, theme) --
            const lp = createLogPanel({
                channel: "keys",
                buildRow, // defined below
                entrySelector: ".log .entry, .log .step",
                maxEntries: 300,
                scrollThresh: 48,
                extractCopyText(el) {
                    const ts = el.querySelector(".ts")?.textContent || "";
                    const badge = (el.querySelector(".badge")?.textContent || "").toUpperCase();
                    const arrow = el.querySelector(".arrow")?.textContent || "";
                    const name = el.querySelector(".key-name, .mouse-name, .scroll-name, .move-name")?.textContent || "";
                    const dim = el.querySelector(".dim")?.textContent || "";
                    const parts = [ts, `[${badge}]`];
                    if (arrow) parts.push(arrow);
                    if (name) parts.push(name);
                    if (dim) parts.push(dim.trim());
                    return parts.join(" ");
                },
            });

            // -- Expose globals for inline handlers --
            window.togglePause = lp.togglePause;
            window.playSlot    = lp.playSlot;
            window.clearLog    = clearLog;
            window.closePanel  = lp.closePanel;
            window.switchTab   = switchTab;
            window.onCoordModeChange = onCoordModeChange;
            window.applyTheme  = lp.applyTheme;

            // -- Entry builder --
            function buildRow(entry) {
                const row = devfmt.inputRow(entry);

                row.onmouseenter = function() { lp.playSlot("hover"); };
                row.onclick = lp._handleEntryClick;

                return row;
            }

            // -- Route entries to the correct log --
            function appendEntry(entry) {
                if (lp.isPaused()) return;
                if (entry.type === "key" && entry.down)
                    flagKey(entry);
                if (entry.type === "mouse" && entry.down)
                    flagMouse(entry);

                const t = entry.type;
                const isMouseSide =
                    t === "mouse" || t === "scroll" || t === "mousemove";
                const log = document.getElementById(
                    isMouseSide ? "mouse-log" : "keys-log",
                );
                const atBottom = lp.isNearBottom(log);
                log.appendChild(buildRow(entry));
                lp.trimLog(log);
                if (atBottom) log.scrollTop = log.scrollHeight;
            }

            function loadHistory(entries) {
                const kl = document.getElementById("keys-log");
                const ml = document.getElementById("mouse-log");
                kl.innerHTML = ml.innerHTML = "";
                const capped =
                    entries && entries.length > lp.maxEntries
                        ? entries.slice(-lp.maxEntries)
                        : entries || [];
                const kf = document.createDocumentFragment();
                const mf = document.createDocumentFragment();
                capped.forEach((e) => {
                    const isMouseSide =
                        e.type === "mouse" ||
                        e.type === "scroll" ||
                        e.type === "mousemove";
                    (isMouseSide ? mf : kf).appendChild(buildRow(e));
                });
                kl.appendChild(kf);
                ml.appendChild(mf);
                kl.scrollTop = kl.scrollHeight;
                ml.scrollTop = ml.scrollHeight;

                const last = devfmt.lastInput(capped);

                if (last.key) flagKey(last.key);
                if (last.mouse) flagMouse(last.mouse);
            }

            // -- Active keys pills --
            function updateActiveKeys(keys) {
                devfmt.renderPills(
                    document.getElementById("keys-pills"),
                    "key",
                    devfmt.keyPills(keys),
                );
            }

            // -- Mouse state (position + active buttons) --
            function updateMouseState(state) {
                const mx = document.getElementById("mx-display");
                const my = document.getElementById("my-display");

                if (state.x != null && mx) mx.textContent = state.x;
                if (state.y != null && my) my.textContent = state.y;

                if (state.buttons === undefined) return;

                devfmt.renderPills(
                    document.getElementById("mouse-pills"),
                    "mouse",
                    devfmt.buttonPills(state.buttons),
                );
            }

            function updateMousePos(pos) {
                if (pos.x != null)
                    document.getElementById("mx-display").textContent = pos.x;
                if (pos.y != null)
                    document.getElementById("my-display").textContent = pos.y;
            }

            // -- Flag row --
            let _lastKeyTime = 0,
                _lastMouseTime = 0;

            function flagKey(entry) {
                _lastKeyTime = Date.now();
                devfmt.renderFlag(
                    document.getElementById("flag-key-pill"),
                    "Key",
                    devfmt.key(entry.key, entry.keyCode),
                    null,
                    false,
                );
                _updateFlagStyles();
            }

            function flagMouse(entry) {
                _lastMouseTime = Date.now();
                devfmt.renderFlag(
                    document.getElementById("flag-mouse-pill"),
                    "Mouse",
                    devfmt.button(entry.button),
                    null,
                    false,
                );
                _updateFlagStyles();
            }

            function _updateFlagStyles() {
                const kRecent = _lastKeyTime >= _lastMouseTime;
                const kp = document.getElementById("flag-key-pill");
                const mp = document.getElementById("flag-mouse-pill");

                if (kp) kp.classList.toggle("flag-recent", kRecent && _lastKeyTime > 0);
                if (mp) mp.classList.toggle("flag-recent", !kRecent && _lastMouseTime > 0);
            }

            // -- Tab switching --
            injectTabStyles();
            const tabs = createTabs({
                onSwitch(tab) {
                    const log = document.getElementById(tab + "-log");
                    if (log) log.scrollTop = log.scrollHeight;
                },
            });
            function switchTab(tab) { tabs.switch(tab); }

            // -- Button actions --
            function clearLog() {
                document.getElementById("keys-log").innerHTML = "";
                document.getElementById("mouse-log").innerHTML = "";
                lp.sendToHost({ action: "clear" });
            }

            function onCoordModeChange(mode) {
                lp.sendToHost({ action: "setCoordMode", mode: mode });
            }

            // -- Coordinate-mode dropdown --
            function coordOptions() {
                return [
                    { value: "screen",       label: "Screen" },
                    { value: "window",       label: "Window TL" },
                    { value: "windowTR",     label: "Window TR" },
                    { value: "windowBL",     label: "Window BL" },
                    { value: "windowBR",     label: "Window BR" },
                    { value: "windowCenter", label: "Window Center" },
                    { value: "screenCenter", label: "Screen center" },
                ];
            }
            var coordSelect = createSelect({
                options: coordOptions(),
                value: "screen",
                onChange: onCoordModeChange,
            });
            document.getElementById("coord-select-mount").appendChild(coordSelect);

            // -- Expose for Lua evaluateJavaScript --
            window.appendEntry      = appendEntry;
            window.loadHistory      = loadHistory;
            window.updateActiveKeys = updateActiveKeys;
            window.updateMouseState = updateMouseState;
            window.updateMousePos   = updateMousePos;

            // -- Init --
            document.addEventListener("DOMContentLoaded", () => {
                if (typeof registerPanel === "function") {
                    registerPanel("keys", function(action, body) {
                        if (action === "appendEntry" && body) window.appendEntry(body);
                        else if (action === "loadHistory" && body) window.loadHistory(body);
                        else if (action === "updateActiveKeys" && body) window.updateActiveKeys(body);
                        else if (action === "updateMouseState" && body) window.updateMouseState(body);
                    });
                }
                if (window.shellPost) {
                    var p = document.getElementById("panel");
                    if (p) { p.style.borderRadius = "0"; p.style.clipPath = "none"; }
                }
                updateActiveKeys([]);
                updateMouseState({ buttons: [] });
                lp.sendToHost({ action: "ready" });
            });
        </script>
    <script>
document.addEventListener("contextmenu", function (e) {
    var t = e.target;
    if (t && t.closest && t.closest(".allow-native-menu")) return;
    e.preventDefault();
});
</script>
